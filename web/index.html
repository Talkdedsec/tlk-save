<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>tlk-save — video downloader</title>
    <meta name="description" content="Download video and audio from YouTube, TikTok, Instagram, X and more than 1800 other sites. No ads, no sign-up, no tracking." />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="tlk-save — video downloader" />
    <meta property="og:description" content="Paste a link, download. YouTube, TikTok, Instagram, X and 1800+ sites. No ads." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="tr_TR" />
    <meta property="og:url" content="https://talkdedsec.github.io/tlk-save/" />
    <meta property="og:image" content="https://talkdedsec.github.io/tlk-save/social.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Apply the saved theme before the first paint, so a light-mode visitor
      // never sees a dark flash and the other way round.
      try {
        var t = localStorage.getItem("tlk-save:theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        var l = localStorage.getItem("tlk-save:locale");
        if (l === "en" || l === "tr") document.documentElement.lang = l;
        else if (/^tr\b/i.test(navigator.language || "")) document.documentElement.lang = "tr";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>tlk-save needs JavaScript. / tlk-save JavaScript gerektirir.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
