[package]
name = "tlk-save"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "HTTP API behind tlk-save: looks links up and downloads them with yt-dlp."
license = "MIT"
repository = "https://github.com/Talkdedsec/tlk-save"
publish = false

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "time", "signal", "sync"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "limit"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
url = "2"
percent-encoding = "2"
rand = "0.9"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
